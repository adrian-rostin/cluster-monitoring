# Grafana Alloy – sammelt Pod-Logs über die Kubernetes-API und schreibt sie nach Loki.
# Chart: grafana/alloy 1.16.0 (App v1.22.0). Namespace: monitoring
# Kein hostPath nötig (Logs kommen über die API, nicht von der Node-Platte).

controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  configMap:
    create: true
    # Alloy-Konfiguration (River-Syntax). Regexe als Backtick-Rohstrings.
    content: |-
      // Nur relevante Namespaces tailen. Auf dem Single Node würde clusterweites
      // Tailen hunderte inotify-Watcher anlegen und das Node-Limit sprengen
      // ("too many open files"). altsetter = Ziel, monitoring = Stack-Debugging.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["altsetter", "monitoring"]
        }
      }

      // Labels setzen und Traefik vollständig ausschließen.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Traefik (kube-system, app.kubernetes.io/name=traefik) GAR NICHT
        // einsammeln – die Datenschutzerklärung sagt "keine Zugriffsprotokolle".
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = "/"
          regex         = "kube-system/traefik"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Logs über die Kubernetes-API lesen (pods/log).
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.scrub.receiver]
      }

      // Datenschutz-Scrubbing, BEVOR etwas nach Loki geschrieben wird.
      // Reihenfolge: IPv4, dann IPv6, dann Query-Strings.
      loki.process "scrub" {
        // IPv4-Adressen -> <ip>
        stage.replace {
          expression = `(?:\d{1,3}\.){3}\d{1,3}`
          replace    = "<ip>"
        }
        // IPv6-Adressen -> <ip>. Mind. 3 Doppelpunkte, damit Uhrzeiten wie
        // 12:30:45.123 (nur 2 Doppelpunkte) NICHT getroffen werden.
        stage.replace {
          expression = `(?:[0-9A-Fa-f]{0,4}:){3,}[0-9A-Fa-f]{0,4}`
          replace    = "<ip>"
        }
        // Query-Strings entfernen (Altsetter-Suchbegriffe stehen als ?q=... in URLs).
        // Alles ab '?' bis zum nächsten Leerzeichen oder Anführungszeichen.
        stage.replace {
          expression = `\?[^\s"]*`
          replace    = "?<entfernt>"
        }

        forward_to = [loki.write.default.receiver]
      }

      // An Loki schreiben.
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
